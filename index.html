<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Humanora AI — AI Text Humanizer & Academic Enhancement Platform</title>
    <meta http-equiv="refresh" content="0; url=./docs/" />
    <link rel="icon" type="image/svg+xml" href="./docs/favicon.svg" />
    <script>
      // Seamless immediate redirect to interactive web application
      window.location.replace("./docs/" + window.location.search + window.location.hash);
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0a0a0d;
        color: #fcd34d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(251, 191, 36, 0.2);
        border-top-color: #fbbf24;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      a {
        color: #fbbf24;
        font-weight: 600;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <h2>Loading Humanora AI Humanizer...</h2>
    <p>If you are not redirected automatically within 2 seconds, <a href="./docs/">click here to enter the app</a>.</p>
  </body>
</html>
