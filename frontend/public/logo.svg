<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd066" />
      <stop offset="50%" stop-color="#e5a93c" />
      <stop offset="100%" stop-color="#b87b1c" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181f" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular background badge -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#33333d" stroke-width="1.5" />
  
  <!-- Subtle circular accent halo -->
  <circle cx="60" cy="60" r="46" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.35" />

  <!-- Integrated Feather & Human Profile Silhouette -->
  <!-- The right/top side forms the feather barbs, while the inner left edge traces a serene human facial profile -->
  <g transform="translate(10, 8)">
    <!-- Feather Back Vanes -->
    <path d="M 50 12 
             C 68 18, 80 32, 78 52
             C 76 66, 68 76, 54 84
             C 48 88, 42 94, 38 100
             C 40 93, 44 87, 49 82
             C 58 74, 66 65, 67 52
             C 68 36, 58 24, 50 12 Z" 
          fill="url(#goldGrad)" 
          opacity="0.9" />

    <!-- Feather Vein Barbs Accents -->
    <path d="M 54 28 C 64 32, 72 38, 75 48" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
    <path d="M 52 42 C 60 48, 68 56, 69 66" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
    <path d="M 48 58 C 55 64, 60 72, 60 80" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.3" />

    <!-- Human Profile Curve (Forehead, Nose, Lips, Chin) integrating into Feather Spine -->
    <path d="M 50 12
             C 44 20, 39 26, 38 34
             C 37 38, 38 41, 40 43
             C 38 44, 36 46, 38 49
             C 39 50, 42 51, 41 53
             C 39 54, 37 55, 38 57
             C 39 60, 43 61, 43 64
             C 43 68, 39 74, 36 80
             C 34 85, 33 93, 34 100
             L 38 100
             C 39 91, 42 84, 46 78
             C 50 71, 52 64, 50 56
             C 48 48, 51 36, 52 28
             Z"
          fill="#ffffff"
          filter="url(#glow)" />

    <!-- Quill Tip Accent Nib -->
    <polygon points="34,100 38,100 36,105" fill="url(#goldGrad)" />
    <!-- Radiance Spark -->
    <circle cx="50" cy="12" r="2.5" fill="#ffd066" filter="url(#glow)" />
  </g>
</svg>
